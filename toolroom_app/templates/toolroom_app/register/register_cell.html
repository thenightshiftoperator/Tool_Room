{% extends 'toolroom_app/root/base.html' %}

{% block content %}
  <p>Add a new cell in the {{ machine_sector }} sector:</p>

  <form action="{% url 'register_machine_cell' machine_sector.id %}" method='post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button name="submit">Save</button>
  </form>
  {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">
            <li>
              {{ message }}
            </li>
          </div>
        {% endfor %}
      {% endif %}

{% endblock content %}
